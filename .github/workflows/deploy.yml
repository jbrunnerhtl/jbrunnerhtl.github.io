# Builds the static site (next.config.ts: output "export") and publishes out/ with the official
# GitHub Pages artifact flow. Requires Settings → Pages → Source: "GitHub Actions".
#
# Least privilege: the build job runs third-party code (npm packages) and only gets read access;
# the deploy job holds the Pages permissions but never checks out or runs repository code.
# Actions are pinned to commit SHAs (tags can be moved); Dependabot proposes updates.
name: Deploy static site

on:
  push:
    branches: [main]
  # Daily rebuild so the GitHub stats on the page (repos, followers, languages) stay current.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

# Never cancel a deployment halfway; a newer run waits for the current one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      # No dependency lifecycle scripts: none are needed for lint or build.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check and lint
        run: |
          npx next typegen
          npx tsc --noEmit
          npm run lint

      # Project sites live under /<repo>/ (e.g. /personal-wesite3.0/); a <user>.github.io repo lives at /.
      # The public site URL (for canonical URLs, sitemap, structured data) is the Pages URL, unless
      # the repository variable SITE_URL names another one (e.g. a custom domain).
      - name: Compute base path and site URL
        id: base
        env:
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [[ "$REPO" == *.github.io ]]; then path=""; else path="/$REPO"; fi
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          site="${CUSTOM_SITE_URL:-https://$owner.github.io$path}"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "site=${site%/}" >> "$GITHUB_OUTPUT"
          echo "Base path: '${path:-/}', site URL: '${site%/}'"

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.base.outputs.site }}
          # Optional: set the repository variable to the token Google Search Console shows.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          # Read-only token, used server-side at build time to avoid GitHub API rate limits on shared runners.
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
